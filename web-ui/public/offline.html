<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#fbfdf6" />
		<title>Offline · Songbook</title>
		<style>
			* { margin: 0; box-sizing: border-box; }
			body {
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 1rem;
				background: #fbfdf6;
				color: #0a1d08;
				font-family: Georgia, "Times New Roman", serif;
				text-align: center;
			}
			main { display: grid; justify-items: center; gap: 1rem; max-width: 22rem; }
			img { width: 4.5rem; height: 4.5rem; }
			h1 { font-size: 1.5rem; font-weight: 600; color: #203b14; }
			p { line-height: 1.5; color: color-mix(in oklab, black 49%, #fff); }
			a {
				display: inline-flex;
				align-items: center;
				height: 2.25rem;
				padding: 0 1rem;
				border-radius: 0.375rem;
				background: #203b14;
				color: #fff;
				font: inherit;
				font-size: 0.875rem;
				text-decoration: none;
			}
			a:focus-visible { outline: 2px solid #203b14; outline-offset: 2px; }
		</style>
	</head>
	<body>
		<main>
			<img src="/songbook.svg" alt="" />
			<h1>Can't reach the station</h1>
			<p>Songbook needs a connection to your station to show its birds. Check your connection and try again.</p>
			<a href="/">Try again</a>
		</main>
	</body>
</html>
